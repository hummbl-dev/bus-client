[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bus-client"
version = "0.1.0"
description = "Stdlib Python client for an append-only TSV coordination log"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["bus_client"]
